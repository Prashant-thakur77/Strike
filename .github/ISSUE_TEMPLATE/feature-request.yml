name: Feature request
description: Suggest an improvement to Strike.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: Who needs this, and what can they not do today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: contracts
    attributes:
      label: Does it need a contract change?
      options:
        - "No"
        - "Yes (needs a new deployment)"
        - Not sure

name: Testnet keeper

# Mirrors mainnet Chainlink stock prices into the testnet MirrorFeeds and settles expired epochs.
# Needs the repository secret KEEPER_PRIVATE_KEY (a key with KEEPER_ROLE on the MirrorFeeds).
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  keep:
    if: ${{ vars.KEEPER_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - chain: 46630
            rpc: https://rpc.testnet.chain.robinhood.com
          - chain: 421614
            rpc: https://sepolia-rollup.arbitrum.io/rpc
    steps:
      - uses: actions/checkout@v7
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1
      # Node packages are only used when a settlement needs more than one round of proof (the SDK finds the hints).
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile && pnpm --filter @strike/sdk --filter @strike/mcp build
      - name: Run keeper once
        if: ${{ hashFiles(format('contracts/deployments/{0}.json', matrix.chain)) != '' }}
        env:
          CHAIN_ID: ${{ matrix.chain }}
          RPC_URL: ${{ matrix.rpc }}
          PRIVATE_KEY: ${{ secrets.KEEPER_PRIVATE_KEY }}
        run: scripts/keeper.sh --once

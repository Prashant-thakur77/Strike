name: CodeQL

# Static analysis of the TypeScript and JavaScript (app, SDK, MCP server, agents, bots, subgraph mappings, scripts)
# with GitHub's default query suite. Solidity is covered by Slither in ci.yml: CodeQL has no Solidity extractor.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Mondays 06:17 UTC, so new queries also run against an unchanged tree.
    - cron: "17 6 * * 1"

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v6
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none
          config: |
            paths-ignore:
              - "**/node_modules"
              - "**/dist"
              - "**/.next"
              - contracts/lib
              - subgraph/generated
              - subgraph/build
      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript-typescript"

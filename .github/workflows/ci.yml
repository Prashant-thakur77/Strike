name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  contracts:
    name: Contracts (forge)
    runs-on: ubuntu-latest
    env:
      FOUNDRY_PROFILE: ci
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1
      - name: Format
        working-directory: contracts
        run: forge fmt --check
      - name: Build
        working-directory: contracts
        run: forge build --sizes
      - name: Test (ci profile)
        working-directory: contracts
        run: forge test -vvv

  stylus:
    name: Stylus pricer (cargo)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stylus/pricer
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.91.0
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: stylus/pricer
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --release --all-targets -- -D warnings
      - name: Test
        run: cargo test --release

  js:
    name: TypeScript packages (pnpm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format
        run: pnpm format:check
      - name: Lint
        run: pnpm -r lint
      - name: Test
        run: pnpm -r test
      - name: Build
        run: pnpm -r build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  differential:
    name: Differential (Stylus Rust vs Solidity pricer)
    runs-on: ubuntu-latest
    env:
      FOUNDRY_PROFILE: ci
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.91.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: stylus/pricer
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1
      - name: Build pricer CLI
        working-directory: stylus/pricer
        run: cargo build --release --example pricer_cli
      - name: Differential fuzz over FFI
        working-directory: contracts
        run: PRICER_CLI=$GITHUB_WORKSPACE/stylus/pricer/target/release/examples/pricer_cli forge test --ffi --match-path "test/differential/*" -vv

  fork:
    name: Fork tests (Robinhood Chain mainnet 4663)
    runs-on: ubuntu-latest
    env:
      ROBINHOOD_RPC_URL: https://rpc.mainnet.chain.robinhood.com
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1
      - name: Fork tests at a pinned block
        working-directory: contracts
        run: forge test --match-path "test/fork/*" -vv

  slither:
    name: Slither (fail on High)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: crytic/slither-action@v0.4.1
        with:
          target: contracts
          slither-args: --filter-paths "lib/|test/|script/" --exclude-dependencies
          fail-on: high

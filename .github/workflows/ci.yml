name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  contracts:
    name: Contracts (forge)
    runs-on: ubuntu-latest
    # A hung step (e.g. a stalled compiler download) fails here instead of holding CI for 6 hours.
    timeout-minutes: 30
    env:
      FOUNDRY_PROFILE: ci
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1
      - name: Format
        working-directory: contracts
        run: forge fmt --check && forge fmt --check examples
      - name: Build
        working-directory: contracts
        run: forge build --sizes
      - name: Test (ci profile)
        working-directory: contracts
        run: forge test -vvv

  stylus:
    name: Stylus pricer (cargo)
    runs-on: ubuntu-latest
    # A hung step (e.g. a stalled compiler download) fails here instead of holding CI for 6 hours.
    timeout-minutes: 30
    defaults:
      run:
        working-directory: stylus/pricer
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.91.0
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: stylus/pricer
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --release --all-targets -- -D warnings
      - name: Test
        run: cargo test --release

  js:
    name: TypeScript packages (pnpm)
    runs-on: ubuntu-latest
    # A hung step (e.g. a stalled compiler download) fails here instead of holding CI for 6 hours.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format
        run: pnpm format:check
      - name: Lint
        run: pnpm -r lint
      - name: Test
        run: pnpm -r test
      - name: Build
        run: pnpm -r build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  differential:
    name: Differential (Stylus Rust vs Solidity pricer)
    runs-on: ubuntu-latest
    # A hung step (e.g. a stalled compiler download) fails here instead of holding CI for 6 hours.
    timeout-minutes: 30
    env:
      FOUNDRY_PROFILE: ci
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.91.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: stylus/pricer
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1
      - name: Build pricer CLI
        working-directory: stylus/pricer
        run: cargo build --release --example pricer_cli
      - name: Differential fuzz over FFI
        working-directory: contracts
        run: PRICER_CLI=$GITHUB_WORKSPACE/stylus/pricer/target/release/examples/pricer_cli forge test --ffi --match-path "test/differential/*" -vv

  fork:
    name: Fork tests (Robinhood Chain mainnet 4663)
    runs-on: ubuntu-latest
    # A hung step (e.g. a stalled compiler download) fails here instead of holding CI for 6 hours.
    timeout-minutes: 30
    env:
      ROBINHOOD_RPC_URL: https://rpc.mainnet.chain.robinhood.com
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1
      - name: Fork tests at the latest block
        working-directory: contracts
        env:
          # Optional repository secret: fork Alchemy's Robinhood Chain mainnet endpoint instead of the public RPC.
          # Pull requests from forks get no secrets and use the public RPC.
          ALCHEMY_API_KEY: ${{ secrets.ALCHEMY_API_KEY }}
        # Alchemy first when the secret is set (GitHub masks the key in the log); if that run fails, the public RPC.
        # The public mainnet RPC sometimes answers CI with a Cloudflare 403; retry once after a pause. A real
        # failure fails every time.
        run: |
          if [ -n "$ALCHEMY_API_KEY" ]; then
            echo "RPC: Alchemy (robinhood-mainnet)"
            if ROBINHOOD_RPC_URL="https://robinhood-mainnet.g.alchemy.com/v2/$ALCHEMY_API_KEY" forge test --match-path "test/fork/*" -vv; then
              exit 0
            fi
            echo "::warning::Fork tests failed on Alchemy; trying the public RPC"
          fi
          echo "RPC: $ROBINHOOD_RPC_URL"
          forge test --match-path "test/fork/*" -vv || (sleep 60 && forge test --match-path "test/fork/*" -vv)

  slither:
    name: Slither (fail on High)
    runs-on: ubuntu-latest
    # A hung step (e.g. a stalled compiler download) fails here instead of holding CI for 6 hours.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: crytic/slither-action@v0.4.1
        with:
          target: contracts
          slither-args: --filter-paths "lib/|test/|script/" --exclude-dependencies
          fail-on: high

  subgraph:
    name: Subgraph (codegen, build, matchstick)
    runs-on: ubuntu-24.04
    # A hung step (e.g. a stalled compiler download) fails here instead of holding CI for 6 hours.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Matchstick runtime dependency
        run: sudo apt-get update && sudo apt-get install -y libpq5
      - name: ABIs are up to date
        working-directory: subgraph
        run: node scripts/copy-abis.mjs --check || echo "::warning::subgraph ABIs differ from contracts/out (run pnpm --filter @strike/subgraph abis)"
      - name: Codegen and build
        working-directory: subgraph
        run: pnpm graph:codegen && pnpm graph:build
      - name: Matchstick tests
        working-directory: subgraph
        run: pnpm graph:test

  e2e:
    name: End-to-end demo (anvil + MCP agent)
    runs-on: ubuntu-latest
    # A hung step (e.g. a stalled compiler download) fails here instead of holding CI for 6 hours.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Full story (deploy, propose, reject and slash, buy, settle, collect)
        run: scripts/demo-local.sh
      - name: In-the-money settlement
        run: SETTLE_PRICE=400 scripts/demo-local.sh

  coverage:
    name: Coverage (forge, src/ only)
    runs-on: ubuntu-latest
    # A hung step (e.g. a stalled compiler download) fails here instead of holding CI for 6 hours.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1
      - name: Coverage summary (fails below 95% of lines)
        working-directory: contracts
        run: |
          forge coverage --ir-minimum --report summary --no-match-coverage "(test|script|lib)/" | tee coverage.txt
          { echo '### Contract coverage'; echo; grep -E '^\|' coverage.txt; } >> "$GITHUB_STEP_SUMMARY"
          python3 - <<'PY'
          import re, sys
          total = [l for l in open("coverage.txt") if l.startswith("| Total")][0]
          lines = float(re.findall(r"([0-9.]+)%", total)[0])
          print(f"line coverage {lines}%")
          sys.exit(0 if lines >= 95 else 1)
          PY

  formal:
    name: Formal verification (halmos)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Lets halmos fetch its pinned SMT solver binaries (cvc5, yices) on first use.
      HALMOS_ALLOW_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install halmos
        run: pip install halmos==0.3.3
      - name: Prove properties (test/formal; 9 proven properties, about 1 minute)
        run: halmos --root contracts --match-contract Formal --solver-timeout-assertion 300s

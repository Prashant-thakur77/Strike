name: Weekly agent

# Agent #1 (the example agent, agents/example) runs every live deployment by itself and publishes a decision record per
# vault, committed back to main, with each record's hash anchored on-chain in that deployment's DecisionLog (--anchor):
#   Robinhood Chain testnet (46630): v2 (46630.json) and v3 next to it (46630-v3.json, through the SDK's STRIKE_*
#     address overrides), records in docs/agent-log (v3's get the `-2` suffix when v2 wrote one for the symbol that day);
#   Arbitrum Sepolia (421614): v3 (421614.json), records in docs/agent-log/arbitrum-sepolia.
# scripts/weekly-agent.sh does one chain: every active deployment file (the keeper's rule) and the TSLA covered-call and
# cash-secured-put vaults in each -vaults.json.
#   Monday: check the NYSE session, then propose this week's option on each vault (prices are kept fresh by
#           keeper.yml). A vault still selling its series is skipped with a notice.
#           Planner: the default rule (0.20 delta at fair value) unless a Claude credential secret is set, in which
#           case Claude plans with --llm (ANTHROPIC_API_KEY: the Claude API; CLAUDE_CODE_OAUTH_TOKEN: the job installs
#           the Claude Code CLI and runs it on a Pro/Max subscription; the API key wins when both are set).
#   Friday after the close: keeper.yml settles the expired series; the agent then records each settlement, and
#           settles itself only if nothing has yet. A vault whose settlement record of the day exists is skipped.
#           Nothing to settle is a notice, not a failure, and writes no record: a series still selling before its
#           expiry, or one that expired while the feed has no round at or after expiry (the mainnet Chainlink feed
#           prints during NYSE hours, so a Friday 20:00 UTC expiry can wait for Monday's open). Such a run shows the
#           step "Waiting for the first print after expiry"; keeper.yml settles the series when the print arrives
#           and then dispatches a settle run, which records it.
# Agent #2 (sTSLA-CSP-A2 on 46630 v2, its own key) runs after them, with --profile conservative on Monday.
# GitHub may drop a scheduled run when it is busy (keeper.yml's 10-minute cron ran every 2.7 to 6.8 hours), so while the
# keeper runs, its chain dispatches this workflow when a slot has passed without a successful run (Monday until 19:00
# UTC, Friday evening); the skips above make a second run a no-op once the first has done the work.
# Switches: the repository variable AGENT_ENABLED = true (without it every run is skipped, which the app's liveness card
# reads as off) and at least one agent key below; with the variable and no agent key every run stops at a notice.
# Secrets (docs/operations.md):
#   AGENT_SIGNER_KEY    agent #1's signer on 46630 v3 and 421614 (0x4fd9…AC6f); without it those are skipped
#   PRIVATE_KEY         the deployer key, agent #1's signer on 46630 v2 (0x26b2…13Ff). Optional: it is also every
#                       contract's admin, so without it v2 is skipped with a warning
#   AGENT2_PRIVATE_KEY  agent #2's signer (0x4501…B79b); without it the agent #2 job is skipped
#   ANTHROPIC_API_KEY or CLAUDE_CODE_OAUTH_TOKEN (optional planner), ALCHEMY_API_KEY (optional RPC)
# A failed run opens a "Weekly agent failing" issue (or comments on it); the next passing run closes it.
run-name: >-
  Weekly agent (${{ github.event_name == 'workflow_dispatch' && inputs.mode || (github.event.schedule == '15 21 * * 5' && 'settle' || 'propose') }})

on:
  schedule:
    # 15:00 UTC is 11:00 New York in summer (EDT) and 10:00 in winter (EST): inside the 09:30-16:00 session all year,
    # with room for GitHub's schedule delays. Holidays are caught by the market check below.
    - cron: "0 15 * * 1"
    # 21:15 UTC is after the 16:00 New York close in summer (20:00 UTC) and in winter (21:00 UTC).
    - cron: "15 21 * * 5"
  workflow_dispatch:
    inputs:
      mode:
        description: "propose (the Monday run) or settle (the Friday run)"
        type: choice
        options: [propose, settle]
        default: propose

permissions:
  contents: write

# One run at a time: a second run (one the keeper's chain dispatched) starts after the first has committed its records,
# and so sees them.
concurrency:
  group: strike-agent
  cancel-in-progress: false

jobs:
  plan:
    name: Keys, mode and NYSE session
    if: ${{ vars.AGENT_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
      date: ${{ steps.mode.outputs.date }}
      go: ${{ steps.gate.outputs.go }}
      agent1: ${{ steps.mode.outputs.agent1 }}
      agent2: ${{ steps.mode.outputs.agent2 }}
    env:
      STRIKE_CHAIN_ID: "46630"
    steps:
      - name: Keys and mode
        id: mode
        env:
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_MODE: ${{ inputs.mode }}
          SIGNER_KEY: ${{ secrets.AGENT_SIGNER_KEY }}
          DEPLOYER_KEY: ${{ secrets.PRIVATE_KEY }}
          AGENT2_KEY: ${{ secrets.AGENT2_PRIVATE_KEY }}
        run: |
          agent1=false
          agent2=false
          if [ -n "$SIGNER_KEY" ] || [ -n "$DEPLOYER_KEY" ]; then agent1=true; fi
          if [ -n "$AGENT2_KEY" ]; then agent2=true; fi
          if [ "$agent1" = false ] && [ "$agent2" = false ]; then
            echo "::notice title=No agent key::AGENT_ENABLED is true but no agent key is a repository secret (AGENT_SIGNER_KEY, AGENT2_PRIVATE_KEY or PRIVATE_KEY; see docs/operations.md). Nothing was run."
          else
            if [ "$agent1" = true ] && [ -z "$SIGNER_KEY" ]; then
              echo "::warning::AGENT_SIGNER_KEY is not set: agent #1's v3 vaults (46630-v3, 421614) will be skipped."
            fi
            if [ "$agent1" = true ] && [ -z "$DEPLOYER_KEY" ]; then
              echo "::notice::PRIVATE_KEY (the deployer, agent #1's v2 signer) is not set: agent #1's v2 vaults on 46630 are skipped."
            fi
          fi
          # Friday's cron settles, Monday's proposes; a dispatch (by hand or by keeper.yml) says which.
          case "$SCHEDULE" in
            *" * * 5") mode=settle ;;
            "") mode="${INPUT_MODE:-propose}" ;;
            *) mode=propose ;;
          esac
          # The NYSE check below runs only for a propose run that has an agent to run.
          market=false
          if [ "$mode" = propose ] && { [ "$agent1" = true ] || [ "$agent2" = true ]; }; then market=true; fi
          {
            echo "mode=$mode"
            echo "market=$market"
            echo "date=$(date -u +%F)"
            echo "agent1=$agent1"
            echo "agent2=$agent2"
          } >> "$GITHUB_OUTPUT"
          echo "Mode: $mode; agent #1: $agent1; agent #2: $agent2"

      - uses: actions/checkout@v7
        if: steps.mode.outputs.market == 'true'
      - name: RPC from strike.config.json
        if: steps.mode.outputs.market == 'true'
        run: echo "STRIKE_RPC_URL=$(jq -er --arg c "$STRIKE_CHAIN_ID" '.chains[$c].rpc.public' strike.config.json)" >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@v6
        if: steps.mode.outputs.market == 'true'
      - uses: actions/setup-node@v7
        if: steps.mode.outputs.market == 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: steps.mode.outputs.market == 'true'
        run: pnpm install --frozen-lockfile

      - name: NYSE session check (propose only; uses the SDK's marketOpen())
        id: market
        if: steps.mode.outputs.market == 'true'
        env:
          ALCHEMY_API_KEY: ${{ secrets.ALCHEMY_API_KEY }}
        run: pnpm --silent --filter @strike/agent-example market-open

      - name: Gate
        id: gate
        env:
          MODE: ${{ steps.mode.outputs.mode }}
          OPEN: ${{ steps.market.outputs.open }}
          ANY: ${{ steps.mode.outputs.agent1 == 'true' || steps.mode.outputs.agent2 == 'true' }}
        run: |
          if [ "$ANY" != true ]; then
            echo "go=false" >> "$GITHUB_OUTPUT"
          elif [ "$MODE" = settle ] || [ "$OPEN" = true ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "go=false" >> "$GITHUB_OUTPUT"
            echo "::notice::The NYSE is closed (holiday?): epochs open only during regular hours. Nothing to do this week."
          fi

  agent:
    name: Agent 1 on ${{ matrix.name }}
    needs: plan
    if: ${{ needs.plan.outputs.go == 'true' && needs.plan.outputs.agent1 == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - chain: 46630
            name: Robinhood Chain testnet (v2 and v3)
            log: docs/agent-log
          - chain: 421614
            name: Arbitrum Sepolia (v3)
            log: docs/agent-log/arbitrum-sepolia
    env:
      CHAIN_ID: ${{ matrix.chain }}
      LOG_DIR: ${{ matrix.log }}
      STRIKE_CHAIN_ID: ${{ matrix.chain }}
    steps:
      - uses: actions/checkout@v7
      # The chain's public RPC from strike.config.json, for the script's reads (RPC_URL) and the agent (STRIKE_RPC_URL).
      - name: RPC from strike.config.json
        run: |
          rpc=$(jq -er --arg c "$CHAIN_ID" '.chains[$c].rpc.public' strike.config.json)
          { echo "RPC_URL=$rpc"; echo "STRIKE_RPC_URL=$rpc"; } >> "$GITHUB_ENV"
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Install Claude Code (the --llm planner on a Claude subscription)
        if: needs.plan.outputs.mode == 'propose'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ] || [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "Not needed: ANTHROPIC_API_KEY is set, or CLAUDE_CODE_OAUTH_TOKEN is not."
            exit 0
          fi
          npm install -g @anthropic-ai/claude-code@2.1.263
          claude --version

      - name: Run agent 1 on each deployment and vault
        id: agent
        env:
          MODE: ${{ needs.plan.outputs.mode }}
          # Agent #1's signers: the deployer on 46630 v2, AGENT_SIGNER_KEY on 46630 v3 and 421614. The script signs
          # each deployment with the key whose address is its -vaults.json agentSigner, and skips it if none is.
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          AGENT_SIGNER_KEY: ${{ secrets.AGENT_SIGNER_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ALCHEMY_API_KEY: ${{ secrets.ALCHEMY_API_KEY }}
        run: |
          # --anchor sends each record's keccak256 hash and GitHub URL to that deployment's DecisionLog.
          # Exit 75: no vault stopped, and at least one expired series waits for its first print after expiry.
          if scripts/weekly-agent.sh "$MODE"; then rc=0; else rc=$?; fi
          failed=0
          waiting=0
          if [ "$rc" = 75 ]; then waiting=1; elif [ "$rc" != 0 ]; then failed=1; fi
          { echo "failed=$failed"; echo "waiting=$waiting"; } >> "$GITHUB_OUTPUT"

      - name: Commit the decision records
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
        env:
          DATE: ${{ needs.plan.outputs.date }}
          MODE: ${{ needs.plan.outputs.mode }}
        run: |
          pnpm exec prettier --write "$LOG_DIR" >/dev/null
          git add "$LOG_DIR"
          if git diff --cached --quiet; then
            echo "No new decision records."
            exit 0
          fi
          for f in $(git diff --cached --name-only -- "$LOG_DIR/*.md"); do
            { cat "$f"; echo; } >> "$GITHUB_STEP_SUMMARY"
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "agent-log: weekly epoch $DATE ($MODE, chain $CHAIN_ID)"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            echo "push attempt $attempt failed; retrying"
            sleep $((attempt * 5))
          done
          exit 1

      # keeper.yml reads this step's name from the run's jobs: a run that waited is checked again later.
      - name: Waiting for the first print after expiry
        if: steps.agent.outputs.waiting == '1'
        run: |
          echo "An expired series waits for the feed's first round at or after expiry (see the notices). keeper.yml" \
            "settles it when the print is mirrored and then dispatches a settle run, which records it." | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Fail when an agent run stopped
        if: steps.agent.outputs.failed == '1'
        run: |
          echo "::error::At least one vault's agent run stopped; see its decision record in $LOG_DIR."
          exit 1

  agent2:
    name: Agent 2 on Robinhood Chain testnet (v2, conservative)
    # After agent #1's jobs, so the two commits to main do not race.
    needs: [plan, agent]
    if: ${{ !cancelled() && needs.plan.outputs.go == 'true' && needs.plan.outputs.agent2 == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      STRIKE_CHAIN_ID: "46630"
      VAULT: "0x8aEb1e0aC30Ff7829609954688B2aC649Ef26969"
      LOG_DIR: docs/agent-log
    steps:
      - uses: actions/checkout@v7
      - name: RPC from strike.config.json
        run: echo "STRIKE_RPC_URL=$(jq -er --arg c "$STRIKE_CHAIN_ID" '.chains[$c].rpc.public' strike.config.json)" >> "$GITHUB_ENV"
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Run agent 2 on sTSLA-CSP-A2
        id: agent
        env:
          MODE: ${{ needs.plan.outputs.mode }}
          STRIKE_AGENT_PRIVATE_KEY: ${{ secrets.AGENT2_PRIVATE_KEY }}
          ALCHEMY_API_KEY: ${{ secrets.ALCHEMY_API_KEY }}
        run: |
          # A vault still selling its series (state 2) has nothing to propose: a notice, not a stopped run (its series
          # runs Friday to Friday, so on a Monday it is often mid-series). A failed read runs the agent anyway.
          # In a settle run, an earlier run has done the work when this vault's settlement is recorded today, or its
          # newest record is a recent "skipped" settle record (scripts/settle-recorded.jq, as weekly-agent.sh does).
          if [ "$MODE" = settle ] && jq -s -e -f scripts/settle-recorded.jq --arg v "${VAULT,,}" --arg d "$(date -u +%F)" \
            --arg w "$(date -u -d '7 days ago' +%F)" "$LOG_DIR"/*.json >/dev/null 2>&1; then
            echo "::notice::sTSLA-CSP-A2's settlement (or nothing to settle) is already recorded; nothing to do"
            echo "failed=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$MODE" = propose ]; then
            manager=$(cast call "$VAULT" "manager()(address)" --rpc-url "$STRIKE_RPC_URL" 2>/dev/null || true)
            state=$( [ -z "$manager" ] || cast call "$manager" "epochs(address)(uint8,uint64,uint256)" "$VAULT" --rpc-url "$STRIKE_RPC_URL" 2>/dev/null | sed -n 1p | awk '{print $1}')
            if [ "$state" = 2 ]; then
              echo "::notice::sTSLA-CSP-A2 is still selling its series; nothing to propose until it settles"
              echo "failed=0" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          # --anchor: into the v2 DecisionLog, which accepts AgentRegistry.signerOf(2), this key.
          # Settle with nothing to settle is the agent's notice: exit 0 before expiry, 75 while waiting for the first
          # print after expiry (scripts/weekly-agent.sh reads the codes the same way).
          flags=(--vault "$VAULT" --log "$GITHUB_WORKSPACE/$LOG_DIR" --anchor)
          if [ "$MODE" = settle ]; then flags+=(--settle); else flags+=(--profile conservative); fi
          if pnpm --silent --filter @strike/agent-example start "${flags[@]}"; then rc=0; else rc=$?; fi
          failed=0
          waiting=0
          if [ "$MODE" = settle ] && [ "$rc" = 75 ]; then waiting=1; elif [ "$rc" != 0 ]; then failed=1; fi
          { echo "failed=$failed"; echo "waiting=$waiting"; } >> "$GITHUB_OUTPUT"

      - name: Commit the decision record
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
        env:
          DATE: ${{ needs.plan.outputs.date }}
          MODE: ${{ needs.plan.outputs.mode }}
        run: |
          pnpm exec prettier --write "$LOG_DIR" >/dev/null
          git add "$LOG_DIR"
          if git diff --cached --quiet; then
            echo "No new decision records."
            exit 0
          fi
          for f in $(git diff --cached --name-only -- "$LOG_DIR/*.md"); do
            { cat "$f"; echo; } >> "$GITHUB_STEP_SUMMARY"
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "agent-log: weekly epoch $DATE ($MODE, agent 2)"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            echo "push attempt $attempt failed; retrying"
            sleep $((attempt * 5))
          done
          exit 1

      - name: Waiting for the first print after expiry
        if: steps.agent.outputs.waiting == '1'
        run: |
          echo "sTSLA-CSP-A2's expired series waits for the feed's first round at or after expiry. keeper.yml settles" \
            "it when the print is mirrored and then dispatches a settle run, which records it." | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Fail when the agent run stopped
        if: steps.agent.outputs.failed == '1'
        run: |
          echo "::error::Agent #2's run stopped; see its decision record in $LOG_DIR."
          exit 1

  report:
    name: Open or close the failure issue
    needs: [plan, agent, agent2]
    if: ${{ !cancelled() && needs.plan.result != 'skipped' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts/ci-issue.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/github-script@v9
        env:
          PLAN: ${{ needs.plan.result }}
          GO: ${{ needs.plan.outputs.go }}
          MODE: ${{ needs.plan.outputs.mode }}
          AGENT1: ${{ needs.agent.result }}
          AGENT2: ${{ needs.agent2.result }}
        with:
          script: |
            const { PLAN, GO, MODE, AGENT1, AGENT2 } = process.env;
            const results = { plan: PLAN, "agent #1": AGENT1, "agent #2": AGENT2 };
            const failed = Object.values(results).includes("failure");
            // A week with nothing to run (no key yet, or the NYSE closed) neither opens nor closes the issue.
            if (!failed && (GO !== "true" || ![AGENT1, AGENT2].includes("success"))) return;
            const { syncIssue } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/ci-issue.mjs`);
            await syncIssue({ github, context, core }, {
              title: "Weekly agent failing",
              failed,
              body: [
                `Mode: ${MODE || "unknown"}. Jobs: ${Object.entries(results).map(([k, v]) => `${k} ${v}`).join(", ")}.`,
                "",
                "A stopped vault run writes a decision record that says why (docs/agent-log). Read-only rehearsal:",
                "`CHAIN_ID=46630 scripts/weekly-agent.sh propose --dry-run` (or `settle --dry-run`, or chain 421614).",
              ].join("\n"),
            });

[package]
name = "strike-pricer"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Fixed-point Black-Scholes pricer for Strike, deployable as an Arbitrum Stylus contract"
repository = "https://github.com/Prashant-thakur77/Strike"

[dependencies]
alloy-primitives = "1.5.7"
alloy-sol-types = "1.5.7"
stylus-sdk = "0.10.9"

[dev-dependencies]
libm = "0.2"
proptest = "1.5"
stylus-sdk = { version = "0.10.9", features = ["stylus-test"] }

[lib]
crate-type = ["lib", "cdylib"]

[features]
default = ["mini-alloc"]
export-abi = ["stylus-sdk/export-abi"]
debug = ["stylus-sdk/debug"]
mini-alloc = ["stylus-sdk/mini-alloc"]
contract-client-gen = []

[[example]]
name = "pricer_cli"

[profile.release]
codegen-units = 1
strip = true
lto = true
panic = "abort"
opt-level = 3

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Strike video cards</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=block"
      rel="stylesheet"
    />
    <style>
      :root {
        --ink: #0d0d0d;
        --ink-teal: #071111;
        --paper: #f1f0ed;
        --mint: #75d0cb;
        --dim: #7d8a89;
        --green: #6fdc9a;
        --red: #ff7a6b;
        --amber: #f2c46d;
        --mono: "JetBrains Mono", ui-monospace, monospace;
        --sans: "Inter Tight", ui-sans-serif, system-ui, sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
      }
      body {
        background: radial-gradient(1200px 700px at 70% 30%, #0f2222 0%, var(--ink-teal) 55%, #040808 100%);
        color: var(--paper);
        font-family: var(--sans);
        overflow: hidden;
      }
      .mode {
        display: none;
      }
      .mode.on {
        display: flex;
      }

      /* ------------------------------------------------------------ terminal (the bottom 150 px hold the captions) */
      .stage {
        position: absolute;
        inset: 44px 80px 178px;
        flex-direction: column;
      }
      .label {
        font: 600 17px/1 var(--sans);
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--mint);
        margin: 0 0 16px;
        display: flex;
        gap: 18px;
        align-items: center;
      }
      .label span.n {
        color: var(--dim);
        text-transform: none;
        letter-spacing: 0.02em;
        font: 500 16px/1 var(--mono);
      }
      .win {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
        background: rgba(8, 10, 10, 0.94);
        border: 1px solid #1f2b2b;
        border-radius: 14px;
        box-shadow: 0 30px 80px rgba(0, 0, 0, 0.55);
        overflow: hidden;
      }
      .bar {
        height: 44px;
        flex: none;
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 0 18px;
        border-bottom: 1px solid #1c2626;
        background: #0b1111;
      }
      .bar i {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: #2b3636;
        display: block;
      }
      .bar b {
        flex: 1;
        text-align: center;
        font: 500 15px/1 var(--mono);
        color: var(--dim);
        margin-right: 60px;
      }
      .screen {
        flex: 1;
        min-height: 0;
        overflow: hidden;
        padding: 20px 30px 24px;
        font: 400 25px/1.5 var(--mono);
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        word-break: normal;
      }
      .screen .l {
        min-height: 1.5em;
        border-radius: 4px;
        transition: background 300ms ease;
      }
      .screen .l.ind {
        padding-left: 3ch;
      }
      .prompt {
        color: var(--mint);
      }
      .cmd {
        color: var(--paper);
        font-weight: 600;
      }
      .caret {
        display: inline-block;
        width: 0.6em;
        height: 1.1em;
        vertical-align: -0.18em;
        background: var(--mint);
        animation: blink 1s steps(1) infinite;
      }
      @keyframes blink {
        50% {
          opacity: 0;
        }
      }
      .step {
        color: var(--mint);
        font-weight: 700;
      }
      .ok {
        color: var(--green);
        font-weight: 600;
      }
      .bad {
        color: var(--red);
        font-weight: 600;
      }
      .dimmed {
        color: var(--dim);
      }
      .title {
        color: var(--paper);
        font-weight: 700;
      }
      .tx {
        color: var(--amber);
        font-weight: 600;
      }
      .l.hl {
        background: rgba(117, 208, 203, 0.13);
        box-shadow: inset 4px 0 0 var(--mint);
      }
      .tool {
        color: var(--mint);
      }
      .why {
        color: #c9d3d2;
        font-style: italic;
      }
      .l.hlbad {
        background: rgba(255, 122, 107, 0.14);
        box-shadow: inset 4px 0 0 var(--red);
      }

      /* ------------------------------------------------------------ evidence card: five numbers */
      .evidence {
        position: absolute;
        inset: 0 0 150px;
        flex-direction: column;
        justify-content: center;
        padding: 0 110px;
      }
      .evidence .kicker {
        font: 600 18px/1 var(--sans);
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--mint);
        margin: 0 0 26px;
      }
      .evidence h2 {
        font: 800 84px/0.98 var(--sans);
        letter-spacing: -0.045em;
        margin: 0 0 64px;
      }
      .evidence ul {
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        border-top: 1px solid #294040;
      }
      .evidence li {
        padding: 30px 30px 0 0;
        font: 500 25px/1.3 var(--sans);
        color: #c9d3d2;
        opacity: 0.35;
        transition:
          opacity 350ms ease,
          transform 350ms ease;
        transform-origin: 0 30%;
      }
      .evidence li strong {
        display: block;
        font: 800 76px/1 var(--sans);
        letter-spacing: -0.03em;
        color: var(--mint);
        margin-bottom: 14px;
        white-space: nowrap;
      }
      .evidence li.seen {
        opacity: 0.9;
      }
      .evidence li.on {
        opacity: 1;
        transform: scale(1.12);
      }
      .evidence .src {
        margin-top: 56px;
        font: 500 20px/1.4 var(--mono);
        color: var(--dim);
      }

      /* ------------------------------------------------------------ list card: short rows, each lit as it is said */
      .list {
        position: absolute;
        inset: 0 0 150px;
        flex-direction: column;
        justify-content: center;
        padding: 0 110px;
      }
      .list .kicker {
        font: 600 18px/1 var(--sans);
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--amber);
        margin: 0 0 22px;
      }
      .list h2 {
        font: 800 76px/0.98 var(--sans);
        letter-spacing: -0.045em;
        margin: 0 0 46px;
      }
      .list ul {
        list-style: none;
        margin: 0;
        padding: 0;
        border-top: 1px solid #294040;
      }
      .list li {
        display: grid;
        grid-template-columns: 520px 1fr;
        gap: 40px;
        padding: 20px 0;
        border-bottom: 1px solid #1f3333;
        opacity: 0.3;
        transition: opacity 350ms ease;
      }
      .list li strong {
        font: 700 34px/1.2 var(--sans);
        color: var(--paper);
      }
      .list li span {
        font: 500 26px/1.35 var(--sans);
        color: #c9d3d2;
      }
      .list li.on {
        opacity: 1;
      }
      .list li.on strong {
        color: var(--amber);
      }
      .list li.seen {
        opacity: 0.85;
      }
      .list .src {
        margin-top: 34px;
        font: 500 20px/1.4 var(--mono);
        color: var(--dim);
      }

      /* ------------------------------------------------------------ light cards (turn, features, challenges): the app's
         paper / ink / teal tokens, as in the three.js scenes */
      body.light {
        background: #e9e9e7;
        color: #111111;
      }
      .turn,
      .features,
      .challenges {
        position: absolute;
        inset: 0 0 150px;
        flex-direction: column;
        justify-content: center;
        padding: 0 120px;
      }
      .wordmark {
        font: 800 150px/0.9 var(--sans);
        letter-spacing: -0.06em;
        margin: 0 0 34px;
      }
      .wordmark em {
        font-style: normal;
        color: #178f9d;
      }
      .imagine {
        position: absolute;
        left: 120px;
        right: 120px;
        top: 50%;
        transform: translateY(-60%);
        font: 800 84px/1.02 var(--sans);
        letter-spacing: -0.045em;
        margin: 0;
        transition: opacity 500ms ease;
      }
      .imagine em {
        font-style: normal;
        color: #0f6e78;
      }
      .imagine.out {
        opacity: 0;
      }
      .turn .one {
        font: 700 52px/1.08 var(--sans);
        letter-spacing: -0.03em;
        max-width: 1500px;
        margin: 0 0 56px;
      }
      .promise {
        display: flex;
        align-items: center;
        gap: 22px;
        font: 600 34px/1.25 var(--sans);
        margin: 0 0 22px;
      }
      .promise i {
        flex: none;
        width: 46px;
        height: 46px;
        border-radius: 50%;
        border: 2px solid #178f9d;
        color: #0f6e78;
        font: 700 24px/42px var(--mono);
        text-align: center;
        font-style: normal;
      }
      .kick {
        font: 600 19px/1 var(--mono);
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: #0f6e78;
        margin: 0 0 40px;
      }
      .cards {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 26px;
      }
      .card {
        border-top: 3px solid #178f9d;
        background: #f1f0ed;
        padding: 34px 26px 34px;
        min-height: 420px;
        display: flex;
        flex-direction: column;
        gap: 22px;
      }
      .card svg {
        width: 92px;
        height: 92px;
        stroke: #111;
        stroke-width: 2.2;
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .card svg .acc {
        stroke: #178f9d;
      }
      .card b {
        font: 800 36px/1.05 var(--sans);
        letter-spacing: -0.03em;
      }
      .card span {
        font: 500 25px/1.32 var(--sans);
        color: #5e5e5b;
      }
      .chal h3 {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 60px;
        margin: 0 0 18px;
        font: 600 19px/1 var(--mono);
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: #0f6e78;
      }
      .chal .row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 60px;
        padding: 24px 0;
        border-top: 1px solid #c9c8c4;
      }
      .chal .row b {
        font: 800 38px/1.1 var(--sans);
        letter-spacing: -0.025em;
      }
      .chal .row span {
        font: 600 32px/1.2 var(--sans);
        color: #0f6e78;
      }
      .chal .row.warn span {
        color: #b3261e;
      }
      .chal .row.warn b {
        color: #5e5e5b;
      }

      /* ------------------------------------------------------------ competition matrix (light) */
      .matrix {
        position: absolute;
        inset: 0 0 150px;
        flex-direction: column;
        justify-content: center;
        padding: 0 70px;
      }
      .matrix h2 {
        font: 800 56px/1 var(--sans);
        letter-spacing: -0.04em;
        margin: 0 0 30px;
      }
      .mx {
        display: grid;
        gap: 0;
      }
      .mx > div {
        padding: 12px 12px;
        font: 500 19px/1.25 var(--sans);
        border-top: 1px solid #c9c8c4;
        transition:
          opacity 400ms ease,
          background 400ms ease;
      }
      .mx .rh {
        font: 700 19px/1.2 var(--sans);
        color: #111;
      }
      .mx .ch {
        font: 800 22px/1.1 var(--sans);
        letter-spacing: -0.01em;
        border-top: 0;
        padding-bottom: 14px;
      }
      .mx .nd {
        color: #8b8b87;
        font-style: italic;
      }
      .mx .strike {
        background: rgba(23, 143, 157, 0.12);
        color: #0b4f57;
        font-weight: 700;
      }
      .mx .ch.strike {
        color: #0f6e78;
      }
      .mx .dim {
        opacity: 0.28;
      }
      .mx .lit {
        background: rgba(242, 196, 109, 0.22);
      }
      .msrc {
        margin-top: 22px;
        font: 500 16px/1.4 var(--mono);
        color: #5e5e5b;
      }

      /* ------------------------------------------------------------ closing card */
      .close {
        position: absolute;
        inset: 0;
        flex-direction: column;
        justify-content: center;
        padding: 0 120px 20px;
      }
      .close .logo {
        font: 800 64px/1 var(--sans);
        letter-spacing: -0.04em;
        color: var(--paper);
        margin-bottom: 40px;
      }
      .close .logo em {
        font-style: normal;
        color: var(--mint);
      }
      .close h1 {
        font: 800 96px/0.97 var(--sans);
        letter-spacing: -0.045em;
        margin: 0 0 70px;
        max-width: 1640px;
      }
      .close .links {
        display: flex;
        flex-direction: column;
        gap: 26px;
        border-top: 1px solid #294040;
        padding-top: 44px;
      }
      .close .app {
        font: 700 60px/1 var(--mono);
        color: var(--paper);
        letter-spacing: -0.02em;
      }
      .close .app span,
      .close .repo span {
        color: var(--mint);
      }
      .close .repo {
        font: 500 34px/1 var(--mono);
        color: #c9d3d2;
      }
      .close .badge {
        align-self: flex-start;
        margin-top: 18px;
        font: 700 22px/1 var(--sans);
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--ink);
        background: var(--amber);
        border-radius: 999px;
        padding: 14px 24px 13px;
      }
      .fade {
        opacity: 0;
        transform: translateY(18px);
        transition:
          opacity 600ms ease,
          transform 600ms ease;
      }
      .fade.in {
        opacity: 1;
        transform: none;
      }
    </style>
  </head>
  <body>
    <div class="stage mode" id="terminal">
      <p class="label"><span id="label">Terminal</span><span class="n" id="labelN"></span></p>
      <div class="win">
        <div class="bar"><i></i><i></i><i></i><b id="wintitle">~/strike</b></div>
        <div class="screen" id="screen"></div>
      </div>
    </div>

    <div class="evidence mode" id="evidence">
      <p class="kicker" id="evKicker"></p>
      <h2 id="evTitle"></h2>
      <ul id="evList"></ul>
      <p class="src" id="evSrc"></p>
    </div>

    <div class="list mode" id="list">
      <p class="kicker" id="liKicker"></p>
      <h2 id="liTitle"></h2>
      <ul id="liList"></ul>
      <p class="src" id="liSrc"></p>
    </div>

    <div class="turn mode" id="turn">
      <p class="imagine" id="turnImagine"></p>
      <p class="wordmark fade">Strike<em>.</em></p>
      <p class="one fade" id="turnOne"></p>
      <div id="turnP"></div>
    </div>

    <div class="features mode" id="features">
      <p class="kick" id="featKick"></p>
      <div class="cards" id="featCards"></div>
    </div>

    <div class="challenges mode chal" id="challenges">
      <h3><span>Challenge</span><span>How Strike solves it</span></h3>
      <div id="chalRows"></div>
    </div>

    <div class="matrix mode" id="matrix">
      <h2 id="mxTitle"></h2>
      <div class="mx" id="mx"></div>
      <p class="msrc" id="mxSrc"></p>
    </div>

    <div class="close mode" id="close">
      <div class="logo fade">Strike<em>.</em></div>
      <h1 class="fade" id="closeTitle"></h1>
      <div class="links">
        <p class="app fade" id="closeApp"></p>
        <p class="repo fade" id="closeRepo"></p>
        <p class="badge fade" id="closeBadge"></p>
      </div>
    </div>

    <script>
      // Filled in by video/record.mjs: { mode: "terminal" | "evidence" | "close", ... }. The recorder drives each card
      // through window.__term / __ev / __close, in time with the narration.
      const DATA = /*__DATA__*/ null;
      const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
      const esc = (s) => s.replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" })[c]);

      // ---------------------------------------------------------------- terminal
      const screen = document.getElementById("screen");
      function classify(line) {
        const t = line.trim();
        if (/^\[\d+\]/.test(t)) return "step";
        if (/^Strike example agent/.test(t)) return "title";
        if (/REJECTED|Agent stopped|DeltaOutOfBand|Slashed|Not compliant|^Agent now/.test(t)) return "bad";
        if (/^(Accepted|Verdict: None|Bought|Max loss|Breakeven)/.test(t)) return "ok";
        if (/^(Connected to|tx 0x|Opened the epoch|Claude Code \d)/.test(t)) return "dimmed";
        if (/^(Claude calls|→ )/.test(t)) return "tool";
        if (/^(Claude's plan|Recomputed|On-chain latestHash|Match)/.test(t)) return "ok";
        if (/^Why:/.test(t)) return "why";
        return "";
      }
      function addLine(html, cls = "") {
        const div = document.createElement("div");
        div.className = "l" + (cls ? " " + cls : "");
        div.innerHTML = html;
        screen.appendChild(div);
        screen.scrollTop = screen.scrollHeight;
        return div;
      }
      function lineHtml(raw) {
        const line = raw.replace(/\s+$/, "");
        const indented = /^ {4}/.test(line);
        const text = indented ? line.slice(4) : line;
        const html = esc(text).replace(
          /0x[0-9a-fA-F]{64}/g,
          (h) => `<span class="tx">${h.slice(0, 10)}…${h.slice(-4)}</span>`,
        );
        return {
          html: line ? `<span class="${classify(line)}">${html}</span>` : "",
          cls: indented ? "ind" : "",
        };
      }
      const term = {
        seg: null,
        i: 0,
        load(seg) {
          this.seg = seg;
          this.i = 0;
          screen.innerHTML = "";
          document.getElementById("label").textContent = seg.label || "";
        },
        promptLine(done = true) {
          const d = addLine(
            `<span class="prompt">strike $ </span><span class="cmd">${esc(this.seg.command)}</span>`,
          );
          if (!done) d.querySelector(".cmd").textContent = "";
          return d;
        },
        /** A second command in the same window: keep what is on screen, print the new prompt. */
        more(seg) {
          this.seg = seg;
          this.i = 0;
          addLine("");
          this.promptLine();
        },
        /** Print the command and every line before the first one matching `until`, at once. */
        prefill(until) {
          this.promptLine();
          const re = new RegExp(until);
          while (this.i < this.seg.lines.length && !re.test(this.seg.lines[this.i])) this.put();
        },
        put() {
          const { html, cls } = lineHtml(this.seg.lines[this.i++]);
          return addLine(html, cls);
        },
        /** Type lines up to and including the first one matching `until`; returns when it is on screen. */
        async type(until, pause = 90) {
          const re = new RegExp(until);
          while (this.i < this.seg.lines.length) {
            const raw = this.seg.lines[this.i];
            if (/^\s*\[\d+\]/.test(raw)) await sleep(pause * 2);
            this.put();
            await sleep(raw.trim() ? pause : 20);
            if (re.test(raw)) return;
          }
        },
        mark(match, cls) {
          const re = new RegExp(match);
          for (const d of screen.querySelectorAll(".l")) if (re.test(d.textContent)) d.classList.add(cls);
        },
        end() {
          addLine('<span class="prompt">strike $ </span><span class="caret"></span>');
        },
      };
      window.__term = term;

      // ---------------------------------------------------------------- evidence card
      window.__ev = {
        focus(i) {
          document.querySelectorAll("#evList li").forEach((el, j) => {
            el.classList.toggle("on", j === i);
            el.classList.toggle("seen", j < i || (i < 0 && j >= 0));
          });
        },
        all() {
          document.querySelectorAll("#evList li").forEach((el) => {
            el.classList.remove("on");
            el.classList.add("seen");
          });
        },
      };

      // ---------------------------------------------------------------- list card
      window.__list = {
        focus(i) {
          document.querySelectorAll("#liList li").forEach((el, j) => {
            el.classList.toggle("on", j === i);
            el.classList.toggle("seen", j < i);
          });
        },
        all() {
          document.querySelectorAll("#liList li").forEach((el) => {
            el.classList.remove("on");
            el.classList.add("seen");
          });
        },
      };

      // ---------------------------------------------------------------- turn, features, challenges
      const showN = async (sel, n) => {
        const items = [...document.querySelectorAll(sel)].slice(0, n);
        for (const el of items) {
          if (el.classList.contains("in")) continue;
          el.classList.add("in");
          await sleep(220);
        }
      };
      window.__turn = {
        show: (n) => {
          document.getElementById("turnImagine").classList.add("out");
          return showN("#turn .fade", n);
        },
      };
      window.__feat = { show: (i) => document.querySelectorAll("#featCards .card")[i]?.classList.add("in") };
      window.__chal = { show: (i) => document.querySelectorAll("#chalRows .row")[i]?.classList.add("in") };
      const ICONS = {
        coin: '<circle cx="50" cy="50" r="34"/><path class="acc" d="M50 30v40M60 38c-2-4-6-6-10-6-6 0-10 3-10 8 0 11 21 6 21 17 0 5-5 9-11 9-5 0-9-2-11-6"/>',
        shield:
          '<path d="M50 14l30 11v22c0 20-13 33-30 39C33 80 20 67 20 47V25z"/><path class="acc" d="M37 50l9 9 17-19"/>',
        cut: '<rect x="18" y="40" width="64" height="34" rx="4"/><path d="M18 52h64"/><path class="acc" d="M50 12v20M42 24l8 8 8-8"/>',
        chip: '<rect x="28" y="28" width="44" height="44" rx="4"/><path d="M38 18v10M50 18v10M62 18v10M38 72v10M50 72v10M62 72v10M18 38h10M18 50h10M18 62h10M72 38h10M72 50h10M72 62h10"/><path class="acc" d="M40 58l6-16 4 10 4-6 6 12"/>',
        chains:
          '<rect x="12" y="34" width="34" height="34" rx="6"/><rect x="54" y="34" width="34" height="34" rx="6"/><path class="acc" d="M46 51h8"/>',
      };

      // ---------------------------------------------------------------- competition matrix: focus(columns) lights those
      // columns and dims the others; focus(null) shows all
      window.__mx = {
        focus(cols) {
          document.querySelectorAll("#mx > div").forEach((el) => {
            const c = Number(el.dataset.c);
            if (c === 0) return el.classList.remove("dim", "lit");
            const on = cols === null || cols.includes(c);
            el.classList.toggle("dim", !on);
            el.classList.toggle("lit", cols !== null && on && c !== 1);
          });
        },
        rows(n) {
          document.querySelectorAll("#mx > div").forEach((el) => {
            el.style.opacity = Number(el.dataset.r) <= n ? "" : "0";
          });
        },
      };

      // ---------------------------------------------------------------- closing card
      window.__close = {
        async show(n) {
          const items = [...document.querySelectorAll("#close .fade")].slice(0, n);
          for (const el of items) {
            if (el.classList.contains("in")) continue;
            el.classList.add("in");
            await sleep(260);
          }
        },
      };

      window.__prepare = async () => {
        document.getElementById(DATA.mode).classList.add("on");
        if (DATA.mode === "terminal") {
          document.getElementById("labelN").textContent = DATA.sublabel || "";
          document.getElementById("wintitle").textContent = DATA.wintitle || "~/strike";
        }
        if (DATA.mode === "evidence") {
          document.getElementById("evKicker").textContent = DATA.kicker;
          document.getElementById("evTitle").textContent = DATA.title;
          document.getElementById("evSrc").textContent = DATA.source;
          document.getElementById("evList").innerHTML = DATA.items
            .map((it) => `<li><strong>${esc(it.big)}</strong>${esc(it.small)}</li>`)
            .join("");
        }
        if (DATA.mode === "list") {
          document.getElementById("liKicker").textContent = DATA.kicker;
          document.getElementById("liTitle").textContent = DATA.title;
          document.getElementById("liSrc").textContent = DATA.source;
          document.getElementById("liList").innerHTML = DATA.items
            .map((it) => `<li><strong>${esc(it.big)}</strong><span>${esc(it.small)}</span></li>`)
            .join("");
        }
        if (["turn", "features", "challenges", "matrix"].includes(DATA.mode))
          document.body.classList.add("light");
        if (DATA.mode === "matrix") {
          document.getElementById("mxTitle").textContent = DATA.title;
          document.getElementById("mxSrc").textContent = DATA.source;
          const mx = document.getElementById("mx");
          mx.style.gridTemplateColumns = `230px repeat(${DATA.projects.length}, 1fr)`;
          const cell = (html, r, c, cls) => `<div data-r="${r}" data-c="${c}" class="${cls}">${html}</div>`;
          let h = cell("", 0, 0, "ch");
          DATA.projects.forEach((p, j) => (h += cell(esc(p), 0, j + 1, `ch${j === 0 ? " strike" : ""}`)));
          DATA.rows.forEach((row, i) => {
            h += cell(esc(row.row), i + 1, 0, "rh");
            row.cells.forEach((t, j) => {
              const cls = [j === 0 ? "strike" : "", /^not described/.test(t) ? "nd" : ""].join(" ");
              h += cell(esc(t), i + 1, j + 1, cls);
            });
          });
          mx.innerHTML = h;
        }
        if (DATA.mode === "turn") {
          document.getElementById("turnOne").textContent = DATA.title;
          document.getElementById("turnImagine").innerHTML = DATA.imagine ?? "";
          document.getElementById("turnP").innerHTML = DATA.promises
            .map((p, i) => `<p class="promise fade"><i>${i + 1}</i>${esc(p)}</p>`)
            .join("");
        }
        if (DATA.mode === "features") {
          document.getElementById("featKick").textContent = DATA.kicker;
          document.getElementById("featCards").innerHTML = DATA.items
            .map(
              (it) =>
                `<div class="card fade"><svg viewBox="0 0 100 100">${ICONS[it.icon] ?? ""}</svg><b>${esc(it.big)}</b><span>${esc(it.small)}</span></div>`,
            )
            .join("");
        }
        if (DATA.mode === "challenges") {
          document.getElementById("chalRows").innerHTML = DATA.rows
            .map(
              ([c, s], i) =>
                `<div class="row fade${i === DATA.rows.length - 1 ? " warn" : ""}"><b>${esc(c)}</b><span>${esc(s)}</span></div>`,
            )
            .join("");
        }
        if (DATA.mode === "close") {
          document.getElementById("closeTitle").textContent = DATA.title;
          document.getElementById("closeApp").innerHTML = `<span>→</span> ${esc(DATA.app)}`;
          document.getElementById("closeRepo").innerHTML = `<span>→</span> ${esc(DATA.repo)}`;
          document.getElementById("closeBadge").textContent = DATA.badge;
        }
        await document.fonts.ready;
      };
    </script>
  </body>
</html>
